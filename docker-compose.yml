# One image, three services. State lives in the `appdata` named volume.
# Override env via .env (see .env.example).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pub-python-repo:latest
    container_name: pub-api
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    image: pub-python-repo:latest
    container_name: pub-worker
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    command: ["python", "-m", "worker.worker"]
    volumes:
      - appdata:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: pub-python-repo:latest
    container_name: pub-ui
    env_file: .env
    environment:
      # UI talks to the API over the internal Docker network.
      API_BASE: http://api:8000
    command: >
      streamlit run ui/Monte_Carlo_Option_Pricing.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  appdata:
